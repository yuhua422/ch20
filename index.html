<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福龜國小辨識比賽 - 100分壓縮優化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); }
        .card { border-radius: 28px; box-shadow: 0 15px 35px rgba(0,0,0,0.06); }
        .hidden-screen { display: none !important; }
        .btn-bounce:active { transform: scale(0.95); }
        .quiz-img-frame { background: #f8fafc; border: 4px solid white; box-shadow: inset 0 2px 10px rgba(0,0,0,0.05); min-height: 280px; }
        .admin-tab { cursor: pointer; padding: 8px 16px; font-weight: bold; border-radius: 10px; transition: all 0.2s; }
        .admin-tab.active { background: #10b981; color: white; }
        @keyframes pulse-fast { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .speed-danger { animation: pulse-fast 1s infinite; color: #ef4444; }
    </style>
</head>
<body class="gradient-bg min-h-screen font-sans text-gray-800">

    <!-- Toast 提示 -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl transition-opacity duration-300 opacity-0 pointer-events-none z-[200] font-bold text-sm text-center">
        提示訊息
    </div>

    <!-- Modal 確認窗 -->
    <div id="custom-modal" class="hidden-screen fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-[24px] max-w-xs w-full shadow-2xl">
            <h3 id="modal-title" class="text-xl font-black text-slate-800 mb-2">確認視窗</h3>
            <p id="modal-desc" class="text-sm text-slate-600 mb-6 font-medium"></p>
            <div class="flex space-x-3">
                <button onclick="closeModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-black">取消</button>
                <button id="modal-confirm-btn" class="flex-1 py-3 bg-rose-500 text-white rounded-xl font-black shadow-lg">確定</button>
            </div>
        </div>
    </div>

    <div id="app" class="max-w-md mx-auto p-4 pt-6">
        
        <!-- 首頁設定 -->
        <div id="setup-screen" class="bg-white p-8 card border border-green-100 relative">
            <button onclick="showAdmin()" class="absolute top-4 right-4 text-slate-300 hover:text-slate-500 text-xs font-bold underline">管理後台</button>
            <div class="text-center mb-6">
                <div class="text-6xl mb-2">🐢</div>
                <h1 class="text-3xl font-black text-green-700 leading-tight">福龜國小<br><span class="text-xl text-green-500 font-bold">115年辨識競速賽</span></h1>
                <p class="text-[10px] text-slate-400 mt-2 font-bold bg-slate-50 py-1 rounded-full italic">總分 100 分系統 | 已啟用圖片壓縮</p>
            </div>
            
            <div class="space-y-4">
                <div class="bg-green-50 p-4 rounded-2xl border border-green-100">
                    <label class="block text-xs font-black text-green-600 mb-1">學生座號</label>
                    <input type="number" id="student-id" placeholder="請輸入座號" class="w-full bg-transparent border-b-2 border-green-200 focus:border-green-500 outline-none p-2 text-2xl font-black text-green-800">
                </div>
                
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <label class="block text-xs font-black text-slate-500 mb-1">測驗題數 (1-15)</label>
                    <input type="number" id="total-questions" value="10" min="1" max="15" class="w-full bg-transparent border-b-2 border-slate-200 focus:border-green-500 outline-none p-2 text-xl font-bold">
                </div>

                <div class="pt-6 space-y-3">
                    <button id="start-btn" onclick="startQuiz()" class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-4 rounded-2xl shadow-xl shadow-green-200 transition-all btn-bounce text-xl flex items-center justify-center opacity-50 cursor-not-allowed" disabled>
                        同步雲端中...
                    </button>
                    <button onclick="showLeaderboard()" class="w-full bg-white text-green-600 font-bold py-3 border-2 border-green-50 rounded-2xl hover:bg-green-50 transition-all text-sm">
                        查看英雄榜 🏆
                    </button>
                </div>
            </div>
        </div>

        <!-- 測驗畫面 -->
        <div id="quiz-screen" class="hidden-screen">
            <div class="flex justify-between items-end mb-4 px-2">
                <div>
                    <span class="text-green-600 font-black text-2xl" id="progress-text">01</span>
                    <span class="text-gray-400 font-bold text-sm"> / <span id="total-text">10</span></span>
                </div>
                <div class="text-right">
                    <span class="text-xs font-black text-gray-400 block tracking-widest uppercase">Speed Bonus</span>
                    <span class="font-mono font-black text-orange-500 text-2xl" id="timer-display">10.0s</span>
                </div>
            </div>
            
            <div class="bg-white card overflow-hidden mb-6 border border-white">
                <div class="quiz-img-frame h-72 flex items-center justify-center relative overflow-hidden bg-slate-50">
                    <img id="quiz-image" src="" alt="教材圖片" class="max-h-full max-w-full object-contain p-2 z-20 transition-opacity duration-300">
                </div>
                <div class="p-6">
                    <div class="flex items-center mb-3">
                        <span class="bg-amber-100 text-amber-700 text-[10px] font-black px-2 py-0.5 rounded tracking-tighter uppercase">Description</span>
                    </div>
                    <p id="item-feature" class="text-gray-700 text-xl font-bold leading-snug min-h-[4em] whitespace-pre-line"></p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="handleAnswer(true)" class="bg-emerald-500 hover:bg-emerald-600 text-white py-6 rounded-[2rem] text-5xl shadow-xl shadow-emerald-100 border-b-[10px] border-emerald-700 btn-bounce">⭕</button>
                <button onclick="handleAnswer(false)" class="bg-rose-500 hover:bg-rose-600 text-white py-6 rounded-[2rem] text-5xl shadow-xl shadow-rose-100 border-b-[10px] border-rose-700 btn-bounce">❌</button>
            </div>
        </div>

        <!-- 管理後台 -->
        <div id="admin-screen" class="hidden-screen bg-white card p-6 border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-black text-slate-800 tracking-tight">管理中心</h2>
                <button onclick="hideAdmin()" class="text-slate-500 text-sm font-bold bg-slate-100 px-3 py-1.5 rounded-lg">返回</button>
            </div>

            <div class="flex space-x-2 mb-6 border-b pb-4">
                <div id="tab-img" class="admin-tab active" onclick="switchAdminTab('img')">照片上傳</div>
                <div id="tab-score" class="admin-tab" onclick="switchAdminTab('score')">成績管理</div>
            </div>
            
            <div id="admin-img-content">
                <p class="text-[10px] text-orange-600 font-bold mb-3">💡 上傳時系統會自動壓縮，以確保能存入雲端。</p>
                <div id="admin-list" class="space-y-3 max-h-[50vh] overflow-y-auto mb-6 pr-2"></div>
                <button id="save-all-btn" onclick="saveAllToFirebase()" class="w-full bg-emerald-600 text-white font-black py-4 rounded-xl shadow-lg flex items-center justify-center">
                    儲存變更 ☁️
                </button>
            </div>

            <div id="admin-score-content" class="hidden-screen">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xs font-bold text-slate-500 uppercase">Records</span>
                    <button onclick="promptClearAll()" class="text-[10px] font-black text-rose-600 bg-rose-50 border border-rose-200 px-3 py-1.5 rounded-lg">清空全部成績</button>
                </div>
                <div id="admin-score-list" class="space-y-2 max-h-[50vh] overflow-y-auto pr-2"></div>
            </div>
        </div>

        <!-- 結束畫面 -->
        <div id="result-screen" class="hidden-screen bg-white p-10 card text-center">
             <div class="text-7xl mb-4">🎖️</div>
             <h2 class="text-2xl font-black text-slate-800">測驗完成</h2>
             
             <div class="bg-green-50 rounded-[2.5rem] p-8 my-6 border border-green-100">
                <div class="text-xs font-black text-green-500 uppercase tracking-widest mb-2">您的得分 (100滿分)</div>
                <div class="text-8xl font-black text-green-600 tabular-nums" id="final-score">0</div>
             </div>

             <div class="flex justify-center space-x-6 mb-8">
                <div>
                    <div class="text-[10px] text-slate-400 font-black uppercase">正確</div>
                    <div class="text-lg font-black text-slate-700" id="result-acc">0/0</div>
                </div>
                <div class="w-[1px] bg-slate-200"></div>
                <div>
                    <div class="text-[10px] text-slate-400 font-black uppercase">平均速度</div>
                    <div class="text-lg font-black text-slate-700" id="result-speed">0.0s</div>
                </div>
             </div>
             
             <button onclick="location.reload()" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl shadow-2xl btn-bounce">再試一次</button>
        </div>

        <!-- 排行榜 -->
        <div id="leaderboard-screen" class="hidden-screen bg-white p-6 card">
            <h2 class="text-2xl font-black text-center mb-6">全校積分榜 🏆</h2>
            <div id="leaderboard-body" class="space-y-2 mb-6"></div>
            <button onclick="hideLeaderboard()" class="w-full bg-slate-200 text-slate-700 py-4 rounded-xl font-black mt-4">回主頁</button>
        </div>

    </div>

    <script>
        // --- 核心變數 ---
        const app_id = "fukui-v115-final-100pts";
        const firebaseConfig = {
            apiKey: "AIzaSyASeGu5IADzRlsj4i_vu28DYKJwxhDecGE",
            authDomain: "read-4a507.firebaseapp.com",
            projectId: "read-4a507",
            storageBucket: "read-4a507.firebasestorage.app",
            messagingSenderId: "813271089720",
            appId: "1:813271089720:web:d77c81018ce465c28a1ccd"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let questionPool = [
            { id: 1, name: "龍船花", feature: "花朵的形狀看起來像是一個金字塔", img: "" },
            { id: 2, name: "鳳仙花", feature: "其花朵可以當作指甲油使用，能搽出紫紅色的顏色", img: "" },
            { id: 3, name: "朝顏（日本牽牛花）", feature: "開花時被日本人稱為「朝顏姬」(織女)，象徵好緣分", img: "" },
            { id: 4, name: "地瓜葉", feature: "此品種為專門吃葉子的「葉用甘藷」", img: "" },
            { id: 5, name: "銅錢草", feature: "具有高度適應性，可以同時種植在水裡和陸地", img: "" },
            { id: 6, name: "鹿角山蘇", feature: "最明顯的特徵是葉子長得就像鹿角一樣", img: "" },
            { id: 7, name: "紅萵苣", feature: "屬於水耕蔬菜區的一員", img: "" },
            { id: 8, name: "龜背芋", feature: "除了戶外，也可以種植在室內環境中", img: "" },
            { id: 9, name: "鹿角蕨", feature: "葉子長大之後，形狀看起來非常像鹿角", img: "" },
            { id: 10, name: "九重葛", feature: "生命力旺盛，一年四季都會盛開", img: "" },
            { id: 11, name: "小天使蔓綠絨", feature: "喜歡涼爽環境，避免夏天陽光直接曝曬", img: "" },
            { id: 12, name: "金午時花", feature: "花朵在早上綻放，到了下午就會凋謝", img: "" },
            { id: 13, name: "朱蕉", feature: "除了葉色特殊，其花朵也是紅色的", img: "" },
            { id: 14, name: "紅姬緣椿象", feature: "幼蟲全身紅色無毒，長大後翅膀下方有黑色特徵", img: "" },
            { id: 15, name: "疣胸琉璃蟻", feature: "屬於外來入侵種，目前已入侵整個南投縣", img: "" }
        ];

        let quizQuestions = [];
        let currentIndex = 0;
        let runningScore = 0;
        let correctCount = 0;
        let reactionTimes = [];
        let startTime = 0;
        let timerInterval = null;

        // --- UI 輔助 ---
        function showToast(msg) {
            const t = document.getElementById('toast'); t.innerText = msg; t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 3000);
        }
        function openModal(title, desc, confirm) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('custom-modal').classList.remove('hidden-screen');
            document.getElementById('modal-confirm-btn').onclick = () => { confirm(); closeModal(); };
        }
        function closeModal() { document.getElementById('custom-modal').classList.add('hidden-screen'); }

        // --- 圖片壓縮功能 (重要：解決上傳失敗) ---
        function compressImage(file, maxWidth = 500, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        // --- 初始化 ---
        async function init() {
            try {
                await auth.signInAnonymously();
                const doc = await db.collection('artifacts').doc(app_id).collection('public').doc('data').collection('settings').doc('questions').get();
                if (doc.exists) {
                    const cloud = doc.data().list;
                    questionPool.forEach((p, i) => { if (cloud[i]?.img) p.img = cloud[i].img; });
                }
                const btn = document.getElementById('start-btn');
                btn.innerText = "開始比賽 🚀"; btn.disabled = false; btn.classList.remove('opacity-50');
            } catch (e) { showToast("連線異常，請重新整理"); }
        }

        // --- 評分邏輯 (100分制) ---
        function getPoints(seconds, totalCount) {
            const perQuestion = 100 / totalCount;
            let mult = 0.6; // 保底 60%
            if (seconds <= 3) mult = 1.0;
            else if (seconds < 10) mult = 1.0 - ((seconds - 3) / 7) * 0.4;
            return perQuestion * mult;
        }

        // --- 比賽流程 ---
        function startQuiz() {
            const sid = document.getElementById('student-id').value;
            if (!sid) return showToast("請輸入座號");
            const count = parseInt(document.getElementById('total-questions').value) || 10;
            quizQuestions = [...questionPool].sort(() => Math.random() - 0.5).slice(0, Math.min(count, 15));
            currentIndex = 0; runningScore = 0; correctCount = 0; reactionTimes = [];
            document.getElementById('total-text').innerText = quizQuestions.length;
            document.getElementById('setup-screen').classList.add('hidden-screen');
            document.getElementById('quiz-screen').classList.remove('hidden-screen');
            showQuestion();
        }

        function showQuestion() {
            if (currentIndex >= quizQuestions.length) return finishQuiz();
            const q = quizQuestions[currentIndex];
            document.getElementById('progress-text').innerText = String(currentIndex + 1).padStart(2, '0');
            document.getElementById('item-feature').innerText = q.feature;
            const img = document.getElementById('quiz-image');
            img.style.opacity = '0';
            img.src = q.img || 'https://placehold.co/600x400/f1f5f9/cbd5e1?text=No+Photo';
            img.onload = () => img.style.opacity = '1';
            
            startTime = Date.now();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                const rem = Math.max(0, 10 - elapsed).toFixed(1);
                const display = document.getElementById('timer-display');
                display.innerText = rem + "s";
                if (elapsed > 7.5) display.classList.add('speed-danger');
                else display.classList.remove('speed-danger');
            }, 100);
        }

        function handleAnswer(isCorrect) {
            const time = (Date.now() - startTime) / 1000;
            if (isCorrect) {
                correctCount++;
                runningScore += getPoints(time, quizQuestions.length);
                reactionTimes.push(time);
            }
            currentIndex++;
            showQuestion();
        }

        async function finishQuiz() {
            if (timerInterval) clearInterval(timerInterval);
            const finalScore = Math.round(runningScore);
            const avgTime = reactionTimes.length > 0 ? (reactionTimes.reduce((a,b)=>a+b,0)/reactionTimes.length).toFixed(1) : "0.0";
            
            document.getElementById('final-score').innerText = finalScore;
            document.getElementById('result-acc').innerText = `${correctCount}/${quizQuestions.length}`;
            document.getElementById('result-speed').innerText = avgTime + "s";
            
            document.getElementById('quiz-screen').classList.add('hidden-screen');
            document.getElementById('result-screen').classList.remove('hidden-screen');

            try {
                await db.collection('artifacts').doc(app_id).collection('public').doc('data').collection('scores').add({
                    studentId: document.getElementById('student-id').value,
                    score: finalScore,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (e) {}
        }

        // --- 管理後台 ---
        function showAdmin() { document.getElementById('setup-screen').classList.add('hidden-screen'); document.getElementById('admin-screen').classList.remove('hidden-screen'); switchAdminTab('img'); }
        function hideAdmin() { document.getElementById('admin-screen').classList.add('hidden-screen'); document.getElementById('setup-screen').classList.remove('hidden-screen'); }
        
        function switchAdminTab(tab) {
            const isImg = tab === 'img';
            document.getElementById('tab-img').className = isImg ? 'admin-tab active' : 'admin-tab';
            document.getElementById('tab-score').className = !isImg ? 'admin-tab active' : 'admin-tab';
            document.getElementById('admin-img-content').className = isImg ? '' : 'hidden-screen';
            document.getElementById('admin-score-content').className = !isImg ? '' : 'hidden-screen';
            if (isImg) renderAdminList(); else fetchScores();
        }

        function renderAdminList() {
            const list = document.getElementById('admin-list');
            list.innerHTML = questionPool.map((item, idx) => `
                <div class="flex items-center space-x-3 border p-3 rounded-xl bg-white border-slate-100 shadow-sm">
                    <div class="w-12 h-12 bg-slate-50 rounded overflow-hidden flex-shrink-0 border">
                        ${item.img ? `<img src="${item.img}" class="w-full h-full object-cover">` : '<div class="w-full h-full flex items-center justify-center text-[10px] text-slate-300 italic">無</div>'}
                    </div>
                    <div class="flex-1 text-sm font-black text-slate-700">${item.name}</div>
                    <input type="file" class="hidden" id="f-${idx}" accept="image/*" onchange="handleImgUpload(${idx})">
                    <label for="f-${idx}" class="text-[10px] bg-slate-100 text-slate-600 font-black px-3 py-2 rounded-lg cursor-pointer hover:bg-emerald-50 hover:text-emerald-600">更換照片</label>
                </div>
            `).join('');
        }

        async function handleImgUpload(idx) {
            const file = document.getElementById(`f-${idx}`).files[0];
            if (!file) return;
            showToast("壓縮中...");
            const compressed = await compressImage(file);
            questionPool[idx].img = compressed;
            renderAdminList();
            showToast("準備完成，記得儲存");
        }

        async function saveAllToFirebase() {
            const btn = document.getElementById('save-all-btn');
            btn.innerText = "同步中..."; btn.disabled = true;
            try {
                // 檢查體積
                const size = new Blob([JSON.stringify(questionPool)]).size;
                if (size > 1000000) {
                    showToast("警告：圖片仍過大，請選用更小的照片或更少照片。");
                }
                await db.collection('artifacts').doc(app_id).collection('public').doc('data').collection('settings').doc('questions').set({ list: questionPool });
                showToast("雲端同步成功 ✅");
            } catch (e) { 
                showToast("同步失敗：可能圖片太大"); 
                console.error(e);
            }
            btn.innerText = "儲存變更 ☁️"; btn.disabled = false;
        }

        async function fetchScores() {
            const list = document.getElementById('admin-score-list');
            list.innerHTML = '<div class="p-10 text-center text-slate-300 italic">載入中...</div>';
            try {
                const snap = await db.collection('artifacts').doc(app_id).collection('public').doc('data').collection('scores').get();
                let records = []; snap.forEach(d => records.push({ id: d.id, ...d.data() }));
                records.sort((a,b) => (b.score || 0) - (a.score || 0));
                list.innerHTML = records.map(r => `
                    <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                        <div class="flex items-center space-x-4">
                            <span class="text-sm font-black text-slate-800">${r.studentId} 號</span>
                            <span class="text-lg text-emerald-500 font-black tabular-nums">${r.score}分</span>
                        </div>
                        <button onclick="promptDeleteScore('${r.id}')" class="text-rose-400 p-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </div>
                `).join('') || '<div class="p-10 text-center text-slate-300">目前無紀錄</div>';
            } catch (e) { list.innerHTML = "讀取失敗"; }
        }

        function promptDeleteScore(id) {
            openModal("刪除成績", "確定要永久刪除此紀錄？", async () => {
                await db.collection('artifacts').doc(app_id).collection('public').doc('data').collection('scores').doc(id).delete();
                fetchScores(); showToast("已刪除");
            });
        }

        function promptClearAll() {
            openModal("危險操作", "將清空所有學生成績，確定嗎？", async () => {
                const snap = await db.collection('artifacts').doc(app_id).collection('public').doc('data').collection('scores').get();
                const batch = db.batch();
                snap.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                fetchScores(); showToast("已清空所有成績");
            });
        }

        async function showLeaderboard() {
            document.getElementById('setup-screen').classList.add('hidden-screen');
            document.getElementById('leaderboard-screen').classList.remove('hidden-screen');
            const list = document.getElementById('leaderboard-body');
            list.innerHTML = '<div class="p-10 text-center opacity-30">計算中...</div>';
            try {
                const snap = await db.collection('artifacts').doc(app_id).collection('public').doc('data').collection('scores').get();
                let data = []; snap.forEach(d => data.push(d.data()));
                data.sort((a,b) => b.score - a.score);
                list.innerHTML = data.slice(0, 10).map((r, i) => `
                    <div class="flex justify-between items-center p-4 bg-white rounded-xl shadow-sm border border-slate-100">
                        <div class="flex items-center space-x-4">
                            <span class="text-xl">${i < 3 ? ['🥇','🥈','🥉'][i] : '🏅'}</span>
                            <span class="font-black text-slate-800">${r.studentId} 號</span>
                        </div>
                        <div class="text-emerald-600 font-black text-2xl">${r.score}</div>
                    </div>
                `).join('') || '<div class="p-10 text-center opacity-30">尚無排行</div>';
            } catch (e) {}
        }
        function hideLeaderboard() { document.getElementById('leaderboard-screen').classList.add('hidden-screen'); document.getElementById('setup-screen').classList.remove('hidden-screen'); }

        window.onload = init;
    </script>
</body>
</html>
